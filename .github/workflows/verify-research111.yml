name: Verify reconciled continuation evidence
on:
  push:
    paths:
      - 'research111/**'
      - 'archives/experiments-111-120-*.tar.xz'
      - '.github/workflows/verify-research111.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify compact identities and every archived evidence member
        run: PYTHONDONTWRITEBYTECODE=1 python3 research111/repairs/code/verify_publication.py
      - name: Verify preserved earlier sources
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_compact.py
      - name: Require unchanged evidence
        run: git diff --exit-code
