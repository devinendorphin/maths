name: Verify bounded allocation research
on:
  push:
    paths:
      - 'research133/**'
      - 'archives/experiments-133-136-allocation.tar.xz'
      - 'README.md'
      - '.github/workflows/verify-research133.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify archive, certificates and replication identities
        run: PYTHONDONTWRITEBYTECODE=1 python3 research133/code/verify_publication.py
      - name: Verify preserved preceding evidence
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 research131/code/verify_publication.py
          PYTHONDONTWRITEBYTECODE=1 python3 research121/code/verify_publication.py
          PYTHONDONTWRITEBYTECODE=1 python3 research111/repairs/code/verify_publication.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_compact.py
      - name: Require unchanged evidence
        run: git diff --exit-code
